<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Verification - Shaivika IT Technologies</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .verify-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }

        .logo { width: 200px; margin-bottom: 30px; }

        .status-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        .status-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 2px solid rgba(16,185,129,0.3); }
        .status-error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 2px solid rgba(239,68,68,0.3); }

        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 30px; font-size: 14px; }

        .details-box {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .detail-row {
            display: flex; justify-content: space-between;
            margin-bottom: 12px;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: var(--text-secondary); font-size: 13px; }
        .detail-value { font-weight: 600; font-size: 14px; }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="verify-card" id="verify-container">
        <img src="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1786872082/Shaivika_IT_Technologies_Logo_p3p7iw.png" alt="Shaivika IT" class="logo">
        
        <div id="loading-state">
            <div class="spinner"></div>
            <h1>Verifying Document...</h1>
            <p>Please wait while we check this document against our secure database.</p>
        </div>

        <div id="result-state" style="display: none;"></div>
        
        <div class="footer">
            &copy; <span id="year"></span> Shaivika IT Technologies. All rights reserved.<br>
            Secure Document Verification System
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // 1. Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const verifyId = urlParams.get('id');

        setTimeout(() => {
            const loadingState = document.getElementById('loading-state');
            const resultState = document.getElementById('result-state');
            
            loadingState.style.display = 'none';
            resultState.style.display = 'block';

            if (!verifyId) {
                showError("Invalid Verification Link", "No document ID was provided in the URL.");
                return;
            }

            // 2. Fetch from LocalStorage DB (Simulating API call)
            // In a real production environment with GAS, this would be a fetch() call to the Google App Script endpoint
            try {
                const invoices = JSON.parse(localStorage.getItem('shaivika_invoices')) || [];
                const invoice = invoices.find(i => i.verification_id === verifyId);

                if (invoice) {
                    showSuccess(invoice);
                } else {
                    showError("Document Not Found", `The document with ID <strong>${verifyId}</strong> does not exist or has been deleted.`);
                }
            } catch (e) {
                showError("System Error", "Unable to connect to the verification database.");
            }

        }, 1500); // Artificial delay to show secure checking process

        function showSuccess(invoice) {
            const html = `
                <div class="status-icon status-success">✓</div>
                <h1 style="color:var(--success)">Document Verified</h1>
                <p>This is an authentic, system-generated document issued by Shaivika IT Technologies.</p>
                
                <div class="details-box">
                    <div class="detail-row">
                        <span class="detail-label">Invoice Number</span>
                        <span class="detail-value">${invoice.invoice_number}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Issue Date</span>
                        <span class="detail-value">${new Date(invoice.invoice_date).toLocaleDateString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Billed To</span>
                        <span class="detail-value">${invoice.customer_name}</span>
                    </div>
                    <div class="detail-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                        <span class="detail-label">Total Amount</span>
                        <span class="detail-value" style="color:var(--primary); font-size:16px;">₹${invoice.total_amount.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Payment Status</span>
                        <span class="detail-value" style="color:${invoice.status === 'PAID' ? 'var(--success)' : 'var(--text-primary)'}">${invoice.status}</span>
                    </div>
                </div>
            `;
            document.getElementById('result-state').innerHTML = html;
        }

        function showError(title, message) {
            const html = `
                <div class="status-icon status-error">✕</div>
                <h1 style="color:var(--danger)">${title}</h1>
                <p>${message}</p>
            `;
            document.getElementById('result-state').innerHTML = html;
        }
    </script>
</body>
</html>
