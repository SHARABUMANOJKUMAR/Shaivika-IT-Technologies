<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification - Shaivika IT Technologies</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #ec4899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.25) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .verify-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        }

        .logo { width: 220px; margin-bottom: 30px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

        .status-icon {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            margin: 0 auto 25px;
            font-size: 42px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05)); color: var(--success); border: 2px solid rgba(16,185,129,0.5); box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        .status-error { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.05)); color: var(--danger); border: 2px solid rgba(239,68,68,0.5); box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }

        h1 { font-size: 32px; margin-bottom: 10px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 30px; font-size: 16px; font-weight: 300; }

        .details-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            animation-delay: 0.2s;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-row {
            display: flex; justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: var(--text-secondary); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-weight: 700; font-size: 15px; text-align: right; color: var(--text-primary); }

        .item-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
            text-align: left;
        }

        .item-table th {
            color: var(--text-secondary);
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .item-table td {
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .item-table tr:last-child td {
            border-bottom: none;
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tag-success { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.1)); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }
        .tag-danger { background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.1)); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .tag-primary { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.1)); color: #60a5fa; border: 1px solid rgba(59,130,246,0.4); }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .footer strong { color: var(--text-primary); font-weight: 600; }

        /* Loading Spinner */
        .loader-container {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 30px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.05);
            border-top: 4px solid #ec4899;
            border-right: 4px solid #8b5cf6;
            border-bottom: 4px solid #3b82f6;
            border-radius: 50%;
            width: 100%; height: 100%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="verify-card" id="verify-container">
        <img src="https://res.cloudinary.com/dwv8kc9vb/image/upload/v1786872082/Shaivika_IT_Technologies_Logo_p3p7iw.png" alt="Shaivika IT Technologies" class="logo">
        
        <div id="loading-state">
            <div class="loader-container">
                <div class="spinner"></div>
            </div>
            <h1>Verifying Document</h1>
            <p>Please wait while we check cryptographic signatures against our secure database.</p>
        </div>

        <div id="result-state" style="display: none;"></div>
        
        <div class="footer">
            &copy; <span id="year"></span> <strong>Shaivika IT Technologies</strong>. All rights reserved.<br>
            Secure Document Verification System v2.0
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const urlParams = new URLSearchParams(window.location.search);
        const verifyId = urlParams.get('id');

        setTimeout(() => {
            const loadingState = document.getElementById('loading-state');
            const resultState = document.getElementById('result-state');
            
            loadingState.style.display = 'none';
            resultState.style.display = 'block';

            if (!verifyId) {
                showError("Invalid Link", "No document verification ID was provided.");
                return;
            }

            try {
                // In production, this data is fetched from the Google Apps Script API endpoint.
                const invoices = JSON.parse(localStorage.getItem('shaivika_invoices')) || [];
                const invoice = invoices.find(i => i.verification_id === verifyId);

                if (invoice) {
                    if (invoice.status === 'DRAFT') {
                        showError("Document Pending", "This document is still a draft and has not been officially issued.");
                    } else {
                        showSuccess(invoice);
                    }
                } else {
                    showError("Document Not Found", `The document with Verification ID <strong>${verifyId}</strong> could not be authenticated. It may have been forged or deleted.`);
                }
            } catch (e) {
                showError("System Error", "Unable to connect to the verification database.");
            }

        }, 1200);

        function showSuccess(invoice) {
            let statusTag = '';
            if (invoice.status === 'PAID') statusTag = '<span class="tag tag-success">Paid in Full</span>';
            else if (invoice.balance_due > 0) statusTag = `<span class="tag tag-danger">Balance: ₹${invoice.balance_due.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>`;
            else statusTag = `<span class="tag tag-primary">${invoice.status}</span>`;

            let itemsHtml = '';
            (invoice.items || []).forEach(item => {
                itemsHtml += `
                    <tr>
                        <td><strong style="color:var(--text-primary); font-size: 15px;">${item.description}</strong><br><span style="color:var(--text-secondary); font-size:12px;">Qty: ${item.qty} × ₹${item.rate.toLocaleString('en-IN')}</span></td>
                        <td style="text-align:right; font-weight: 700; color:var(--text-primary);">₹${item.total.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
                    </tr>
                `;
            });

            const html = `
                <div class="status-icon status-success">✓</div>
                <h1 style="color:var(--success)">Document Verified</h1>
                <p>This is an authentic, tamper-proof document issued by Shaivika IT Technologies.</p>
                
                <div class="details-box">
                    <div class="detail-row">
                        <span class="detail-label">Verification ID</span>
                        <span class="detail-value" style="font-family:monospace; color:var(--primary); background: rgba(59,130,246,0.1); padding: 4px 8px; border-radius: 6px;">${invoice.verification_id}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Invoice Number</span>
                        <span class="detail-value">${invoice.invoice_number}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Issue Date</span>
                        <span class="detail-value">${new Date(invoice.invoice_date).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Billed To</span>
                        <span class="detail-value">${invoice.customer_name}</span>
                    </div>
                    
                    <div style="margin-top: 25px; padding-top: 15px; border-top: 1px dashed var(--border);">
                        <span class="detail-label">Itemized Breakdown</span>
                        <table class="item-table">
                            ${itemsHtml}
                        </table>
                    </div>

                    <div class="detail-row" style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border);">
                        <span class="detail-label">Total Amount</span>
                        <span class="detail-value" style="color:var(--success); font-size:22px; font-weight: 800; text-shadow: 0 0 15px rgba(16,185,129,0.3);">₹${invoice.total_amount.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">${statusTag}</span>
                    </div>
                </div>
            `;
            document.getElementById('result-state').innerHTML = html;
        }

        function showError(title, message) {
            const html = `
                <div class="status-icon status-error">✕</div>
                <h1 style="color:var(--danger)">${title}</h1>
                <p>${message}</p>
                <div style="margin-top: 25px; padding: 20px; background: rgba(239,68,68,0.1); border-radius: 12px; border: 1px solid rgba(239,68,68,0.2); font-size: 14px; text-align: left; line-height: 1.6;">
                    <strong style="color:var(--danger); display:block; margin-bottom:8px; font-size: 15px;">Security Warning:</strong> If you received a physical document claiming to match this ID, it is likely fraudulent. Please contact Shaivika IT Technologies immediately.
                </div>
            `;
            document.getElementById('result-state').innerHTML = html;
        }
    </script>
</body>
</html>
