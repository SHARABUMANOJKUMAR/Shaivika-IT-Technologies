        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-primary);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .background-blobs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s infinite alternate;
        }

        .blob-1 { background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { background: var(--secondary); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 290px;
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 10;
            box-sizing: border-box;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .sidebar-logo {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.25rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-nav {
            list-style: none;
            flex-grow: 1;
        }

        .sidebar-item {
            margin-bottom: 6px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar-link:hover, .sidebar-link.active {
            color: var(--text-primary);
            background: rgba(255,255,255,0.04);
        }

        .sidebar-link.active {
            background: rgba(37, 99, 235, 0.12);
            border-left: 3px solid var(--primary);
            border-radius: 0 12px 12px 0;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-glass);
            padding-top: 20px;
        }

        .main-content {
            flex-grow: 1;
            padding: 32px 40px;
            overflow-y: auto;
            width: calc(100% - 290px);
            min-width: 0;
            box-sizing: border-box;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(37, 99, 235, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .stat-details h3 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-details p {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .data-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .data-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .search-input {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 240px;
        }

        .data-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th, .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 0.875rem;
        }

        .data-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Animated row transitions */
        .tr-project-row {
            transition: background-color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        .tr-project-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .tr-row-deleting {
            animation: trRowDelete 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        @keyframes trRowDelete {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1);
                background: rgba(239, 68, 68, 0.15);
            }
            50% {
                opacity: 0.5;
                transform: translateX(20px) scale(0.98);
            }
            100% {
                opacity: 0;
                transform: translateX(-50px) scale(0.9);
                height: 0;
                padding-top: 0;
                padding-bottom: 0;
                visibility: hidden;
            }
        }

        .tr-row-highlight {
            animation: trRowHighlight 1.5s ease-out;
        }

        @keyframes trRowHighlight {
            0% {
                background: rgba(59, 130, 246, 0.35);
                box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.5);
            }
            100% {
                background: transparent;
                box-shadow: none;
            }
        }

        @keyframes pulseWarning {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(239,68,68,0.3); }
            50% { transform: scale(1.06); box-shadow: 0 0 30px rgba(239,68,68,0.5); }
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .tag-blue { background: rgba(37, 99, 235, 0.15); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.3); }
        .tag-purple { background: rgba(147, 51, 234, 0.15); color: #c084fc; border: 1px solid rgba(147, 51, 234, 0.3); }
        .tag-cyan { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
        .tag-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.open { display: flex; }

        .modal-content {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
            animation: modalScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalScale {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-full { grid-column: 1 / -1; }

        .textarea-input {
            width: 100%;
            height: 100px;
            resize: vertical;
        }

        .lead-detail-field { margin-bottom: 14px; }
        .lead-detail-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; }
        .lead-detail-value { font-size: 0.95rem; color: var(--text-primary); line-height: 1.5; background: rgba(255, 255, 255, 0.02); padding: 10px; border-radius: 8px; border: 1px solid var(--border-glass); }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 14px 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { font-size: 1.25rem; }

        /* Mobile Header and Sidebar Toggle */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            z-index: 999;
        }

        .mobile-header-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .mobile-menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* Responsive Wrappers */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 1rem;
        }

        .chart-responsive-container {
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .mobile-header { display: flex; }
            
            /* Sidebar as Drawer */
            .sidebar {
                position: fixed;
                top: 0;
                left: -320px;
                width: 280px;
                height: 100vh;
                z-index: 1001;
                transition: left 0.3s ease;
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
                overflow-y: auto;
            }
            .sidebar.active {
                left: 0;
            }

            .main-content { padding: 16px; overflow-x: hidden; width: 100%; box-sizing: border-box; }
            .form-grid { grid-template-columns: 1fr; }
            #catGridContainer { grid-template-columns: 1fr !important; }
            
            /* Stats Grid */
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
            }

            /* Invoice Dashboard Cards */
            .inv-dash-cards {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 12px;
            }
            
            /* Billing Header Actions */
            .inv-flex-between {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 15px;
            }
            .inv-flex-between > div {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            /* Modals */
            .modal-content {
                width: 95%;
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 20px);
                margin: 10px auto;
                padding: 20px;
                overflow-y: auto;
            }
            .inv-modal-content {
                width: 95%;
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 20px);
                margin: 10px auto;
                overflow-y: auto;
            }
            
            /* Typography / Content Fitting */
            .page-title { font-size: 1.5rem; }
            .inv-dash-title { font-size: 1.5rem; }
        }
